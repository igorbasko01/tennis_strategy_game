name: Deploy online server to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'webapp/src/engine/**'
      - '.github/workflows/deploy-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'webapp/src/engine/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: server

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Pull requests only check that the Worker builds; main applies migrations and deploys.
      - run: npx wrangler deploy --dry-run --outdir dist
        if: github.event_name == 'pull_request'
      - run: npx wrangler d1 migrations apply tennis-strategy --remote
        if: github.event_name != 'pull_request'
      - run: npx wrangler deploy
        if: github.event_name != 'pull_request'
