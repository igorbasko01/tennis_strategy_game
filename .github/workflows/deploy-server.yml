name: Deploy the game to Cloudflare

# The Worker serves both the web app (built from webapp/) and the online server
# (server/) at https://tennisim.baskorp.com.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'webapp/**'
      - '.github/workflows/deploy-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'webapp/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            server/package-lock.json
      - name: Build the web app
        working-directory: webapp
        run: |
          npm ci
          npm test
          npm run build
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      # Pull requests only check that the Worker builds; main applies migrations and deploys.
      - run: npx wrangler deploy --dry-run --outdir dist
        if: github.event_name == 'pull_request'
        working-directory: server
      - run: npx wrangler d1 migrations apply tennis-strategy --remote
        if: github.event_name != 'pull_request'
        working-directory: server
      - run: npx wrangler deploy
        if: github.event_name != 'pull_request'
        working-directory: server
