# The game's Cloudflare Worker: serves the web app and the online server (/api/*)
# at https://tennisim.baskorp.com. Deployed by .github/workflows/deploy-server.yml,
# which builds webapp/dist first.
name = "tennis-strategy"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# The game's own address. Cloudflare creates the DNS record and certificate.
routes = [{ pattern = "tennisim.baskorp.com", custom_domain = true }]

# The built web app. Only /api/* runs the Worker; everything else is a static file.
[assets]
directory = "../webapp/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tennis-strategy"
database_id = "30381f56-304a-4678-8ecc-a342bdc702bd"
migrations_dir = "migrations"

[observability]
enabled = true
