<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d3b1a" />
    <meta name="description" content="A simultaneous turn-based tennis strategy game. Pick your shot, read your opponent." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Tennis Strategy</title>
  </head>
  <body>
    <div id="app">
      <header id="scoreboard"></header>
      <main id="stage">
        <div id="situation" class="situation hidden"></div>
        <div id="callout" class="callout"></div>
      </main>
      <section id="panel" aria-live="polite"></section>
    </div>

    <div id="menu" class="overlay">
      <div class="menu-card">
        <div class="ball-icon" aria-hidden="true"></div>
        <h1>Tennis<br />Strategy</h1>
        <p class="tagline">Outsmart your opponent</p>

        <button id="resume" class="primary big hidden">Resume match</button>
        <button class="primary big" data-act="tournament">Tournament</button>
        <button class="primary big" data-act="practice">Practice match</button>
        <button class="ghost" data-act="profile">Profile</button>
        <button class="ghost" data-open-help>How to play</button>
        <button class="ghost" data-act="settings">Settings</button>
      </div>
    </div>

    <div id="profile" class="overlay hidden"></div>

    <div id="settings" class="overlay hidden"></div>

    <div id="practice" class="overlay hidden">
      <div class="menu-card">
        <h2>Practice match</h2>
        <div class="setting">
          <span class="setting-label">Your skill</span>
          <div class="segmented skills" data-setting="playerSkill" data-skill-options></div>
        </div>
        <div class="setting">
          <span class="setting-label">CPU skill</span>
          <div class="segmented skills" data-setting="cpuSkill" data-skill-options></div>
        </div>
        <button id="start" class="primary big">Start match</button>
        <button class="ghost" data-act="back">Back</button>
      </div>
    </div>

    <div id="tournament" class="overlay hidden"></div>

    <div id="help" class="overlay hidden">
      <div class="sheet">
        <div class="sheet-head">
          <h2>How to play</h2>
          <button class="icon-btn" data-close-help aria-label="Close">✕</button>
        </div>
        <div id="help-body"></div>
      </div>
    </div>

    <div id="over" class="overlay hidden"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
